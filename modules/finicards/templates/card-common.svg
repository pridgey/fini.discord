<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="606" height="849" viewBox="0 0 606 849" font-family="DejaVu Sans, Verdana, sans-serif">
<defs>
<clipPath id="art"><rect x="32" y="32" width="542" height="{art_h}" rx="14"></rect></clipPath>
<pattern id="hatch" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <rect width="34" height="34" fill="#edeff8"></rect><rect width="17" height="34" fill="#e3e6f4"></rect>
</pattern>
<pattern id="hatchDark" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <rect width="34" height="34" fill="#1d1f2a"></rect><rect width="17" height="34" fill="#181a23"></rect>
</pattern>
<linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0b0f" stop-opacity="0.78"></stop><stop offset="1" stop-color="#0a0b0f" stop-opacity="0"></stop></linearGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="{t_soft}"></stop><stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop></linearGradient>
<radialGradient id="tint" gradientUnits="userSpaceOnUse" cx="10" cy="839" r="820.4" gradientTransform="translate(10 839) scale(1 0.7579) translate(-10 -839)"><stop offset="0" stop-color="{t_soft}" stop-opacity="0.1"></stop><stop offset="0.45" stop-color="{t_soft}" stop-opacity="0.040"></stop><stop offset="0.8" stop-color="{t_soft}" stop-opacity="0"></stop></radialGradient>
</defs>
<rect id="frame" width="606" height="849" rx="26" fill="#2b2d37"></rect>
<rect id="card-face" x="10" y="10" width="586" height="829" rx="19" fill="#111218"></rect>
<rect x="10" y="10" width="586" height="829" rx="19" fill="url(#tint)"></rect>
<g clip-path="url(#art)">
  {art_window}
  <rect x="32" y="32" width="542" height="96" fill="url(#scrim)"></rect>
</g>
<rect x="32.5" y="32.5" width="541" height="{art_edge_h}" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"></rect>
<g id="header">
  <text x="54" y="64" font-size="15" font-weight="700" letter-spacing="3.3" fill="#ffffff" fill-opacity="0.72">{faction}</text>
  <text x="552" y="69" text-anchor="end" font-size="26" font-weight="700" font-style="italic" fill="#ffffff">{rarity_code}</text>
  <text id="limited" x="552" y="90" text-anchor="end" font-size="13" font-weight="700" letter-spacing="1.56" fill="#ffffff" fill-opacity="0.82">{limited}</text>
</g>
<text id="name" x="32" y="526" font-size="{name_size}" font-weight="700" font-style="italic" letter-spacing="-0.5" fill="#f2f3f7">{card_name}</text>
{professions}
<rect x="32" y="574" width="358" height="2" fill="url(#rule)"></rect>
{ability}
{stat_bar}
<g id="footer" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.04" fill="#ffffff" fill-opacity="0.42">
<text x="32" y="815">{card_number}</text><text x="574" y="815" text-anchor="end">{artist}</text></g>
</svg>
