<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="744" height="1042" viewBox="0 0 320 448" font-family="Archivo, &#39;Archivo&#39;, sans-serif">
<defs>

<clipPath id="face"><rect x="8" y="8" width="304" height="432" rx="10"></rect></clipPath>
<pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <rect width="18" height="18" fill="#edeff8"></rect><rect width="9" height="18" fill="#e3e6f4"></rect>
</pattern>
<pattern id="hatchDark" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <rect width="18" height="18" fill="#2a2d4d"></rect><rect width="9" height="18" fill="#23264a"></rect>
</pattern>

<linearGradient id="foilSilver" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#f4f5fa"></stop><stop offset="0.24" stop-color="#dcdfe9"></stop><stop offset="0.4" stop-color="#ffffff"></stop><stop offset="0.62" stop-color="#d3d7e4"></stop><stop offset="1" stop-color="#fbfbfd"></stop>
</linearGradient>
<linearGradient id="typeLead" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{t_main}"></stop><stop offset="1" stop-color="{t_deep}"></stop></linearGradient>
<pattern id="dashRule" width="12" height="2" patternUnits="userSpaceOnUse"><rect width="6" height="2" fill="{t_main}"></rect></pattern>
</defs>
<rect id="foil-border" width="320" height="448" rx="16" fill="url(#foilSilver)"></rect>
<rect id="card-face" x="8" y="8" width="304" height="432" rx="10" fill="#ffffff"></rect>
<g clip-path="url(#face)">
  <text id="watermark" x="302" y="352" text-anchor="end" font-size="100" font-weight="800" fill="{t_main}" opacity="0.045" letter-spacing="-5">{watermark}</text>
  <g id="header">
    <rect x="14" y="21.5" width="8" height="8" fill="{t_main}" transform="rotate(45 18 25.5)"></rect>
    <text x="29" y="29.5" font-size="11" font-weight="800" letter-spacing="2" fill="{t_deep}">{faction}</text>
    <text x="301" y="29.5" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.3" fill="{t_pale_ink}">{rarity_code}</text>
  </g>
  <rect x="8" y="43" width="304" height="2" fill="url(#dashRule)"></rect>
  {art_window}
  <text id="name" x="22" y="239" font-size="19" font-weight="800" fill="#14162a" letter-spacing="-0.3">{card_name}</text>
  {professions}
  <line x1="22" y1="268" x2="301" y2="268" stroke="{t_hairline}"></line>
  <line x1="22" y1="362" x2="301" y2="362" stroke="{t_hairline}"></line>
  {ability}
  {flavour}
  {stat_bar}
  <g id="footer" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="0.7" fill="#a2a8c8">
  <text x="22" y="430">{card_number}</text><text x="298" y="430" text-anchor="end">{artist}</text></g>
</g>
</svg>