<svg xmlns="http://www.w3.org/2000/svg" width="744" height="1042" viewBox="0 0 320 448" font-family="Archivo, &#39;Archivo&#39;, sans-serif">
<defs>

<clipPath id="face"><rect x="8" y="8" width="304" height="432" rx="10"></rect></clipPath>
<pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <rect width="18" height="18" fill="#edeff8"></rect><rect width="9" height="18" fill="#e3e6f4"></rect>
</pattern>
<pattern id="hatchDark" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <rect width="18" height="18" fill="#2a2d4d"></rect><rect width="9" height="18" fill="#23264a"></rect>
</pattern>

<linearGradient id="foilLight" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#f7f8fc"></stop><stop offset="0.18" stop-color="#dfe3f5"></stop><stop offset="0.34" stop-color="#ffffff"></stop><stop offset="0.52" stop-color="#cfd6ef"></stop><stop offset="0.7" stop-color="#ffffff"></stop><stop offset="0.86" stop-color="#e6e9f7"></stop><stop offset="1" stop-color="#f2f4fb"></stop>
</linearGradient>
<linearGradient id="hdrIndigo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B95FF"></stop><stop offset="0.7" stop-color="#6c78f0"></stop><stop offset="1" stop-color="#5865F2"></stop></linearGradient>
<linearGradient id="witLead" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B95FF"></stop><stop offset="1" stop-color="#5865F2"></stop></linearGradient>
<linearGradient id="wash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B95FF" stop-opacity="0"></stop><stop offset="1" stop-color="#8B95FF" stop-opacity="0.2"></stop></linearGradient>
<linearGradient id="panelIndigo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"></stop><stop offset="1" stop-color="#eef0ff"></stop></linearGradient>
<linearGradient id="footBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5865F2"></stop><stop offset="1" stop-color="#8B95FF"></stop></linearGradient>
<pattern id="lines" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1" height="9" fill="#5865F2" opacity="0.08"></rect></pattern>
</defs>
<rect id="foil-border" width="320" height="448" rx="16" fill="url(#foilLight)"></rect>
<rect id="card-face" x="8" y="8" width="304" height="432" rx="10" fill="#ffffff"></rect>
<g clip-path="url(#face)">
  <rect x="8" y="230" width="304" height="210" fill="url(#wash)"></rect>
  <rect x="8" y="230" width="304" height="210" fill="url(#lines)"></rect>
  <text id="watermark" x="300" y="376" text-anchor="end" font-size="118" font-weight="800" font-style="italic" fill="#8B95FF" opacity="0.09" letter-spacing="-6">S</text>
  <rect x="13" y="13" width="294" height="422" rx="6" fill="none" stroke="#dfe2f6"></rect>
  <rect x="16" y="16" width="288" height="416" rx="4" fill="none" stroke="#eef0fb"></rect>
  <g id="header">
    <rect x="17" y="17" width="286" height="31" rx="4" fill="url(#hdrIndigo)"></rect>
    <rect x="28" y="28.5" width="9" height="9" fill="#ffffff" transform="rotate(45 32.5 33)"></rect>
    <text x="45" y="36.5" font-size="11" font-weight="800" letter-spacing="2" fill="#ffffff">SAVANT</text>
    <text x="292" y="36.5" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.3" fill="#ffffff" opacity="0.9">U</text>
  </g>
  <g id="art-window">
  <rect id="ART" x="20" y="56" width="280" height="186" fill="url(#hatch)"></rect>
  <text x="160" y="152" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" letter-spacing="1" fill="#9aa1c4">CHARACTER ART</text>
</g>
  <rect x="20" y="56" width="280" height="186" fill="none" stroke="#dde0f5"></rect>
  <rect x="22" y="256" width="16" height="2" fill="#8B95FF"></rect>
  <text id="name" x="44" y="263" font-size="21" font-weight="800" fill="#14162a" letter-spacing="-0.4">Ayaka Mirei</text>
  <g id="professions">
    <rect x="44" y="272" width="60" height="15" rx="2" fill="#8B95FF"></rect>
    <text x="50" y="282.5" font-size="8" font-weight="700" letter-spacing="0.6" fill="#ffffff">RITUALIST</text>
    <rect x="108" y="272" width="62" height="15" rx="2" fill="#eceefe"></rect>
    <text x="114" y="282.5" font-size="8" font-weight="700" letter-spacing="0.6" fill="#4d5490">LIBRARIAN</text>
  </g>
  <rect id="ability-panel" x="21" y="297" width="278" height="60" rx="5" fill="url(#panelIndigo)" stroke="#ccd2fb"></rect>
  <text id="ability" font-size="10.5" fill="#2b2e4a">
    <tspan x="32" y="315"><tspan font-weight="800" fill="#4d5490">Marginalia</tspan> — Once per turn, look at the top</tspan>
    <tspan x="32" y="330">two cards of your deck. Put one back on top.</tspan>
  </text>
  <g id="stat-bar">
  <rect x="21" y="368" width="73.0" height="34" rx="4" fill="#f7f8ff" stroke="#d8dcfb"></rect>
  <text x="30.0" y="388" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="1.1" fill="#9aa1c4">STR</text>
  <text x="85.0" y="392" text-anchor="end" font-weight="800" font-size="18" fill="#3f4262">3</text>
<rect x="97.97297297297297" y="368" width="124.1" height="34" rx="4" fill="url(#witLead)" stroke="none"></rect>
  <text x="107.0" y="388" font-family="JetBrains Mono, monospace" font-size="8.5" letter-spacing="1.4" fill="#ffffff" fill-opacity="0.9">WIT</text>
  <text x="213.0" y="392" text-anchor="end" font-weight="800" font-size="24" fill="#ffffff">9</text>
<rect x="226.02702702702703" y="368" width="73.0" height="34" rx="4" fill="#f7f8ff" stroke="#d8dcfb"></rect>
  <text x="235.0" y="388" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="1.1" fill="#9aa1c4">HRT</text>
  <text x="290.0" y="392" text-anchor="end" font-weight="800" font-size="18" fill="#3f4262">5</text>
</g>
  <g id="footer" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="0.7" fill="#5865F2">
  <text x="22" y="428">ECH-062 · U</text><text x="298" y="428" text-anchor="end">ART / placeholder</text></g>
  <rect x="8" y="434" width="304" height="6" fill="url(#footBar)"></rect>
</g>
</svg>