<svg xmlns="http://www.w3.org/2000/svg" width="744" height="1042" viewBox="0 0 320 448" font-family="Archivo, &#39;Archivo&#39;, sans-serif">
<defs>

<clipPath id="face"><rect x="8" y="8" width="304" height="432" rx="10"></rect></clipPath>
<pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <rect width="18" height="18" fill="#edeff8"></rect><rect width="9" height="18" fill="#e3e6f4"></rect>
</pattern>
<pattern id="hatchDark" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <rect width="18" height="18" fill="#2a2d4d"></rect><rect width="9" height="18" fill="#23264a"></rect>
</pattern>

<linearGradient id="foilGold" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#fffdf6"></stop><stop offset="0.2" stop-color="#f0dfb2"></stop><stop offset="0.38" stop-color="#ffffff"></stop><stop offset="0.58" stop-color="#e4cf9a"></stop><stop offset="0.76" stop-color="#fffaf0"></stop><stop offset="1" stop-color="#f2e4c0"></stop>
</linearGradient>
<linearGradient id="scrimR" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0a0a18" stop-opacity="0.4"></stop><stop offset="0.24" stop-color="#0a0a18" stop-opacity="0"></stop><stop offset="0.58" stop-color="#ffffff" stop-opacity="0"></stop><stop offset="0.95" stop-color="#ffffff" stop-opacity="0.98"></stop>
</linearGradient>
<linearGradient id="witLeadR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5865F2"></stop><stop offset="1" stop-color="#3A46C4"></stop></linearGradient>
<linearGradient id="nameRule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5865F2"></stop><stop offset="0.55" stop-color="#e4cf9a"></stop><stop offset="1" stop-color="#e4cf9a" stop-opacity="0"></stop></linearGradient>
<linearGradient id="panelGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfaf4"></stop><stop offset="1" stop-color="#f6f2e6"></stop></linearGradient>
</defs>
<rect id="foil-border" width="320" height="448" rx="16" fill="url(#foilGold)"></rect>
<rect id="card-face" x="7" y="7" width="306" height="434" rx="11" fill="#ffffff"></rect>
<g clip-path="url(#face)">
  <g id="art-window">
  <rect id="ART" x="7" y="7" width="306" height="268" fill="url(#hatch)"></rect>
  <text x="160" y="144" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" letter-spacing="1" fill="#9aa1c4">CHARACTER ART</text>
</g>
  <rect x="7" y="7" width="306" height="268" fill="url(#scrimR)"></rect>
  <g id="header">
    <rect x="20" y="18" width="86" height="22" rx="3" fill="#0c0e22" opacity="0.55"></rect>
    <rect x="20" y="18" width="3" height="22" fill="#5865F2"></rect>
    <text x="31" y="32.5" font-size="10.5" font-weight="800" letter-spacing="1.9" fill="#ffffff">SAVANT</text>
    <path d="M292 20 h5 l-3 12 h-5 z" fill="#e4cf9a"></path>
    <text x="301" y="32.5" text-anchor="end" font-size="13" font-weight="800" font-style="italic" fill="#ffffff">R</text>
  </g>
  <rect x="22" y="260" width="277" height="2" fill="url(#nameRule)"></rect>
  <text id="name" x="22" y="284" font-size="24" font-weight="800" fill="#14162a" letter-spacing="-0.6">Sable Ondrey</text>
  <g id="professions">
    <rect x="22" y="292" width="58" height="15" rx="2" fill="#5865F2"></rect>
    <text x="28" y="302.5" font-size="8" font-weight="700" letter-spacing="0.6" fill="#ffffff">DIPLOMAT</text>
    <rect x="84" y="292" width="76" height="15" rx="2" fill="#eceefe"></rect>
    <text x="90" y="302.5" font-size="8" font-weight="700" letter-spacing="0.6" fill="#4d5490">CARTOGRAPHER</text>
  </g>
  <rect id="ability-panel" x="22" y="317" width="277" height="58" rx="5" fill="url(#panelGold)" stroke="#ece2c9"></rect>
  <text id="ability" font-size="10.5" fill="#2b2e4a">
    <tspan x="33" y="335"><tspan font-weight="800" fill="#3A46C4">Safe Passage</tspan> — Choose an ally. It cannot</tspan>
    <tspan x="33" y="350">be targeted by opposing effects until your next turn.</tspan>
  </text>
  <g id="stat-bar">
  <rect x="22" y="380" width="72.7" height="32" rx="4" fill="#14162a" stroke="none"></rect>
  <text x="31.0" y="399" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="1.1" fill="#e4cf9a">STR</text>
  <text x="85.7" y="403" text-anchor="end" font-weight="800" font-size="18" fill="#ffffff">5</text>
<rect x="98.7027027027027" y="380" width="123.6" height="32" rx="4" fill="url(#witLeadR)" stroke="none"></rect>
  <text x="107.7" y="399" font-family="JetBrains Mono, monospace" font-size="8.5" letter-spacing="1.4" fill="#ffffff" fill-opacity="0.9">WIT</text>
  <text x="213.3" y="403" text-anchor="end" font-weight="800" font-size="24" fill="#ffffff">8</text>
<rect x="226.2972972972973" y="380" width="72.7" height="32" rx="4" fill="#14162a" stroke="none"></rect>
  <text x="235.3" y="399" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="1.1" fill="#e4cf9a">HRT</text>
  <text x="290.0" y="403" text-anchor="end" font-weight="800" font-size="18" fill="#ffffff">6</text>
</g>
  <g id="footer" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="0.7" fill="#a2a8c8">
    <text x="22" y="430">ECH-101 · R</text><text x="298" y="430" text-anchor="end">ART / placeholder</text></g>
</g>
</svg>