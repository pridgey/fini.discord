<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="744" height="1042" viewBox="0 0 320 448" font-family="Archivo, &#39;Archivo&#39;, sans-serif">
<defs>

<clipPath id="face"><rect x="8" y="8" width="304" height="432" rx="10"></rect></clipPath>
<pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <rect width="18" height="18" fill="#edeff8"></rect><rect width="9" height="18" fill="#e3e6f4"></rect>
</pattern>
<pattern id="hatchDark" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <rect width="18" height="18" fill="#2a2d4d"></rect><rect width="9" height="18" fill="#23264a"></rect>
</pattern>

<linearGradient id="foilHolo" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#ffeef5"></stop><stop offset="0.16" stop-color="{t_glow}"></stop><stop offset="0.3" stop-color="#ffffff"></stop><stop offset="0.46" stop-color="#c3c8f7"></stop><stop offset="0.6" stop-color="#ffffff"></stop><stop offset="0.78" stop-color="#ffd6e5"></stop><stop offset="1" stop-color="#f5b7cc"></stop>
</linearGradient>
<linearGradient id="scrimRR" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="{t_bright}" stop-opacity="0.24"></stop><stop offset="0.3" stop-color="#0f1020" stop-opacity="0"></stop><stop offset="0.6" stop-color="#0f1020" stop-opacity="0.55"></stop><stop offset="0.82" stop-color="#0f1020" stop-opacity="0.93"></stop><stop offset="1" stop-color="#0f1020" stop-opacity="0.98"></stop>
</linearGradient>
<linearGradient id="typeLead" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{t_bright}"></stop><stop offset="1" stop-color="{t_main}"></stop></linearGradient>
</defs>
<rect id="foil-border" width="320" height="448" rx="16" fill="url(#foilHolo)"></rect>
<rect id="card-face" x="6" y="6" width="308" height="436" rx="12" fill="#0f1020"></rect>
<g clip-path="url(#face)">
  {art_window}
  <rect x="6" y="6" width="308" height="436" fill="url(#scrimRR)"></rect>
  <g id="sparkle" fill="#ffffff">
    <circle cx="62" cy="102" r="1" opacity="0.9"></circle><circle cx="238" cy="67" r="1.4" opacity="0.75"></circle>
    <circle cx="136" cy="233" r="1" opacity="0.6"></circle><circle cx="277" cy="180" r="1.2" opacity="0.8"></circle>
  </g>
  <g id="header">
    <rect x="20" y="18" width="86" height="22" rx="3" fill="#ffffff" opacity="0.14"></rect>
    <rect x="20" y="18" width="3" height="22" fill="{t_bright}"></rect>
    <text x="31" y="32.5" font-size="10.5" font-weight="800" letter-spacing="1.9" fill="#ffffff">{faction}</text>
    <text x="300" y="33" text-anchor="end" font-size="14" font-weight="800" font-style="italic" fill="{t_glow}">{rarity_code}</text>
  </g>
  <text id="name" x="22" y="296" font-size="27" font-weight="800" fill="#ffffff" letter-spacing="-0.7">{card_name}</text>
  {professions}
  <rect id="ability-panel" x="22" y="330" width="276" height="58" rx="6" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.16"></rect>
  {ability}
  {stat_bar}
  <g id="footer" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="0.7" fill="#ffffff" fill-opacity="0.5">
  <text x="22" y="434">{card_number}</text><text x="298" y="434" text-anchor="end">{artist}</text></g>
</g>
</svg>