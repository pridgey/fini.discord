<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="744" height="1042" viewBox="0 0 320 448" font-family="Archivo, &#39;Archivo&#39;, sans-serif">
<defs>

<clipPath id="face"><rect x="8" y="8" width="304" height="432" rx="10"></rect></clipPath>
<pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <rect width="18" height="18" fill="#edeff8"></rect><rect width="9" height="18" fill="#e3e6f4"></rect>
</pattern>
<pattern id="hatchDark" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <rect width="18" height="18" fill="#2a2d4d"></rect><rect width="9" height="18" fill="#23264a"></rect>
</pattern>

<linearGradient id="foilLight" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#f7f8fc"></stop><stop offset="0.18" stop-color="#dfe3f5"></stop><stop offset="0.34" stop-color="#ffffff"></stop><stop offset="0.52" stop-color="#cfd6ef"></stop><stop offset="0.7" stop-color="#ffffff"></stop><stop offset="0.86" stop-color="#e6e9f7"></stop><stop offset="1" stop-color="#f2f4fb"></stop>
</linearGradient>
<linearGradient id="hdrIndigo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="{t_bright}"></stop><stop offset="0.7" stop-color="{t_main}"></stop><stop offset="1" stop-color="{t_deep}"></stop></linearGradient>
<linearGradient id="typeLead" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{t_bright}"></stop><stop offset="1" stop-color="{t_deep}"></stop></linearGradient>
<linearGradient id="wash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{t_bright}" stop-opacity="0"></stop><stop offset="1" stop-color="{t_bright}" stop-opacity="0.2"></stop></linearGradient>
<linearGradient id="panelIndigo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"></stop><stop offset="1" stop-color="{t_pale_fill}"></stop></linearGradient>
<linearGradient id="footBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="{t_deep}"></stop><stop offset="1" stop-color="{t_bright}"></stop></linearGradient>
<pattern id="lines" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1" height="9" fill="{t_deep}" opacity="0.08"></rect></pattern>
</defs>
<rect id="foil-border" width="320" height="448" rx="16" fill="url(#foilLight)"></rect>
<rect id="card-face" x="8" y="8" width="304" height="432" rx="10" fill="#ffffff"></rect>
<g clip-path="url(#face)">
  <rect x="8" y="230" width="304" height="210" fill="url(#wash)"></rect>
  <rect x="8" y="230" width="304" height="210" fill="url(#lines)"></rect>
  <text id="watermark" x="300" y="376" text-anchor="end" font-size="118" font-weight="800" font-style="italic" fill="{t_bright}" opacity="0.09" letter-spacing="-6">{watermark}</text>
  <rect x="13" y="13" width="294" height="422" rx="6" fill="none" stroke="{t_hairline}"></rect>
  <rect x="16" y="16" width="288" height="416" rx="4" fill="none" stroke="{t_pale_fill}"></rect>
  <g id="header">
    <rect x="17" y="17" width="286" height="31" rx="4" fill="url(#hdrIndigo)"></rect>
    <rect x="28" y="28.5" width="9" height="9" fill="#ffffff" transform="rotate(45 32.5 33)"></rect>
    <text x="45" y="36.5" font-size="11" font-weight="800" letter-spacing="2" fill="#ffffff">{faction}</text>
    <text x="292" y="36.5" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.3" fill="#ffffff" opacity="0.9">{rarity_code}</text>
  </g>
  {art_window}
  <rect x="20" y="56" width="280" height="186" fill="none" stroke="{t_hairline}"></rect>
  <rect x="22" y="256" width="16" height="2" fill="{t_bright}"></rect>
  <text id="name" x="44" y="263" font-size="21" font-weight="800" fill="#14162a" letter-spacing="-0.4">{card_name}</text>
  {professions}
  <rect id="ability-panel" x="21" y="297" width="278" height="60" rx="5" fill="url(#panelIndigo)" stroke="{t_hairline}"></rect>
  {ability}
  {stat_bar}
  <g id="footer" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="0.7" fill="{t_deep}">
  <text x="22" y="428">{card_number}</text><text x="298" y="428" text-anchor="end">{artist}</text></g>
  <rect x="8" y="434" width="304" height="6" fill="url(#footBar)"></rect>
</g>
</svg>